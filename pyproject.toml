[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sphinx-csharp"
version = "0.1.12"
description = "C# domain for Sphinx"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "djungelorm", email = "djungelorm@users.noreply.github.com" }]
requires-python = ">=3.11"
dependencies = ["Sphinx>=9.0", "requests"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Documentation :: Sphinx",
]

[project.urls]
Homepage = "https://github.com/djungelorm/sphinx-csharp"

[tool.hatch.build.targets.sdist]
include = ["sphinx_csharp", "tests", "CHANGES.txt"]

[tool.hatch.envs.lint]
dependencies = ["ruff"]

[tool.hatch.envs.lint.scripts]
check = "ruff check sphinx_csharp tests"

[tool.hatch.envs.types]
dependencies = ["mypy", "types-docutils", "types-requests"]

[tool.hatch.envs.types.scripts]
check = "mypy sphinx_csharp"

[tool.hatch.envs.test]
dependencies = ["breathe", "pytest", "pytest-cov"]

[[tool.hatch.envs.test.matrix]]
python = ["3.11", "3.12", "3.13", "3.14", "3.15"]

[tool.hatch.envs.test.scripts]
all = "pytest --cov=sphinx_csharp --cov-report=term-missing {args}"

[tool.pytest.ini_options]
testpaths = ["tests"]
xfail_strict = true
addopts = "-rs"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "PL"]
ignore = ["PLR2004"]

[tool.ruff.lint.pylint]
max-args = 10
