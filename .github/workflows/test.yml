name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

# A new push to a pull request cancels the runs for the old commits. Each other run has a group of its own, as
# GitHub drops a pending run in a group when a newer one queues.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: pip install -r .github/requirements.txt
      - run: hatch run lint:check

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install -r .github/requirements.txt
      - run: hatch run types:check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
        # The latest release, and the version in Ubuntu 24.04
        doxygen: ['1.15.0', '1.9.8']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: ./.github/actions/doxygen
        with:
          version: ${{ matrix.doxygen }}
      - run: pip install -r .github/requirements.txt
      # Every Sphinx and Breathe version on this Python
      - run: hatch run matrix:all --python ${{ matrix.python }}

  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        doxygen: ['1.15.0', '1.9.8']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - uses: ./.github/actions/doxygen
        with:
          version: ${{ matrix.doxygen }}
      # The archives that the corpus test downloads, which its sha256 hashes pin
      - uses: actions/cache@v6
        with:
          path: .cache/corpus
          key: corpus-${{ hashFiles('tests/test_corpus.py') }}
      - run: pip install -r .github/requirements.txt
      - run: hatch run test.py3.14-9.1-5.1:corpus

  # Checks the sdist and wheel, the files in the wheel, and a build of the basic project with the wheel installed
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install -r .github/requirements.txt
      - run: hatch run package:check
