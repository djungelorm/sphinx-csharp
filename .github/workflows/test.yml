name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install hatch
      - run: hatch run lint:check

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install hatch
      - run: hatch run types:check

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get install -y doxygen
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: pip install hatch
      - run: hatch run test.py${{ matrix.python }}:all

  test-sphinx:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sphinx: ['7.2', '7.3', '7.4', '8.0', '8.1', '8.2']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: sudo apt-get install -y doxygen
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: pip install hatch
      - run: hatch run test.py3.11-${{ matrix.sphinx }}:all
